<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inf Egg Co.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="logo">
      <span id="logo-egg">🥚</span>
      <span id="logo-text">INF EGG CO.<small>egg ranch &amp; factory</small></span>
    </div>
    <div id="resources">
      <div class="res-chip" id="chip-coins" title="Coins — the truck pays when it returns">🪙 <b id="r-coins">0</b></div>
      <div class="res-chip" id="chip-feathers" title="Feathers — earned by hatching, spent on Research">🪶 <b id="r-feathers">0</b></div>
      <div class="res-chip" id="chip-basket" title="Eggs in your hands">🧺 <b id="r-basket">0</b></div>
      <div class="res-chip" id="chip-eggs" title="Eggs lying on the field">🥚 <b id="r-eggs">0</b></div>
      <div class="res-chip" id="chip-chick" title="Chickens / capacity">🐔 <b id="r-chick">0/8</b></div>
    </div>
    <div id="sys-buttons">
      <button class="btn btn-tiny btn-gold" data-act="research" title="Research tree">🧪 RESEARCH</button>
      <button class="btn btn-tiny" data-act="pedia" title="Chickenpedia">📖</button>
      <button class="btn btn-tiny" id="btn-mute" data-act="mute" title="Sound on/off">🔊</button>
      <button class="btn btn-tiny" data-act="save" title="Save now">💾</button>
      <button class="btn btn-tiny" data-act="reset" title="Reset everything">🗑️</button>
    </div>
  </header>

  <div id="hintbar"><span id="hint-arrow">▶</span> <span id="hint-text"></span></div>

  <div id="stage-wrap">
    <canvas id="world" width="1152" height="624"></canvas>
    <div id="mama-card">
      <span class="mc-title">MAMA</span>
      <span class="tier-chip" id="mama-chip">Common</span>
      <button class="btn btn-gold" id="btn-mama-up" data-act="mama-up">⬆</button>
    </div>
    <div id="build-bar"></div>
    <div id="cursor-chip" hidden></div>
  </div>

  <footer id="statsbar"><span id="stats-line"></span></footer>

  <!-- RESEARCH MODAL -->
  <div class="modal" id="modal-skills" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>🧪 CLUCKOLOGY RESEARCH</h2>
        <span class="panel-sub" id="research-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">✖</button>
      </div>
      <p class="flavor">Hatch chickens to earn 🪶 feathers. Spend them on very serious science.</p>
      <div id="skill-tree"></div>
    </div>
  </div>

  <!-- PEDIA MODAL -->
  <div class="modal" id="modal-pedia" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>📖 CHICKENPEDIA</h2>
        <span class="panel-sub" id="pedia-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">✖</button>
      </div>
      <p class="flavor">Every weird chicken the ranch has ever hatched. Collect all 100!</p>
      <div id="pedia"></div>
    </div>
  </div>

  <div id="fx-layer"></div>
  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
