<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inf Egg Co.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'%3E%3Cpath fill='%232e2216' d='M3 0h4v1h-4M2 1h1v1h-1M7 1h1v1h-1M1 2h1v6h-1M8 2h1v6h-1M2 8h1v2h-1M7 8h1v2h-1M3 10h4v1h-4'/%3E%3Cpath fill='%23fff8ee' d='M3 1h4v1h-4M2 2h6v6h-6M3 8h4v2h-4'/%3E%3Cpath fill='%23f2e2c8' d='M6 3h2v5h-2M5 8h2v2h-2'/%3E%3Cpath fill='%23ffd23f' d='M4 4h2v1h-2M3 6h1v1h-1M6 6h1v1h-1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

 <div id="stage-row">
  <div id="stage-wrap">
    <canvas id="world" width="1152" height="624"></canvas>

    <div id="res-float">
      <div class="hud-bar">
        <span class="pill" id="pill-coins" title="Coins in the company account"><b id="r-coins">0</b></span>
        <span class="pill" id="pill-feathers" title="Feathers, for research at the Lab"><b id="r-feathers">0</b></span>
        <span class="pill" id="pill-feed" title="Feed pellets in the barn"><b id="r-feed">0/40</b></span>
        <span class="pill" id="pill-cap" title="Chickens on the ranch"><b id="r-cap">0/10</b></span>
        <button class="pill" id="pill-food" data-act="open-food" title="The pantry - produce and goods, tap to open"><b id="r-food">0</b></button>
        <button class="pill" id="pill-bugs" data-act="open-bugs" title="The bug jar - worms and grubs, tap to scatter or sell" hidden><b id="r-bugs">0</b></button>
        <span class="pill" id="pill-sky" title="The weather over the valley"><b id="r-sky">CLEAR</b></span>
        <button class="pill" id="pill-age" data-act="open-ages" title="The age the company is in - tap for what the next one needs"><b id="r-age">STRAW AGE</b></button>
      </div>
    </div>

    <div id="build-palette" hidden></div>
    <div id="farm-palette" hidden></div>
    <div id="trip-view" hidden>
      <canvas id="trip-canvas" width="480" height="168"></canvas>
    </div>

    <div id="menu-pop" hidden>
      <button class="btn" data-act="open-settings">SETTINGS</button>
      <button class="btn" data-act="open-wardrobe">WARDROBE</button>
      <button class="btn" data-act="open-ach">ACHIEVEMENTS</button>
      <button class="btn" data-act="open-company">COMPANY</button>
      <button class="btn" data-act="save">SAVE</button>
      <button class="btn" data-act="title">MAIN MENU</button>
    </div>

    <div id="inspect-panel" hidden></div>
    <div id="title-screen">
      <canvas id="title-canvas" width="384" height="208"></canvas>
      <div id="menu-ui" hidden></div>
      <div id="title-buttons" hidden>
        <button class="btn btn-green" data-act="start-game">START</button>
      </div>
      <div id="intro-ui" hidden>
        <button class="btn btn-green" data-act="intro-next">NEXT</button>
        <button class="btn" data-act="intro-skip">SKIP</button>
      </div>
      <div id="company-form" hidden></div>
    </div>
    <div id="todo-panel" hidden></div>
    <div id="cursor-chip" hidden></div>
  </div>

  <!-- THE RAIL: every button that used to stand on the field -->
  <div id="siderail">
    <div id="deskbar"></div>
    <div id="toolbelt"></div>
  </div>
 </div>

  <!-- RESEARCH: the computer on the Lab desk -->
  <div class="modal lab" id="modal-skills" hidden>
    <div class="modal-panel tree-panel">
      <div class="modal-head">
        <h2>THE LAB</h2>
        <span class="panel-sub" id="research-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="tree-wrap">
        <canvas id="tree-canvas" width="760" height="440"></canvas>
      </div>
      <div id="skill-card"></div>
    </div>
  </div>

  <!-- THE LOGISTICS HQ: a wall map, a garage and a stack of dispatch slips -->
  <div class="modal" id="modal-depot" hidden>
    <div class="modal-panel office">
      <div class="modal-head">
        <h2>LOGISTICS HQ</h2>
        <span class="panel-sub" id="depot-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="depot-map-wrap" hidden>
        <canvas id="depot-map" width="720" height="320"></canvas>
      </div>
      <div id="depot-body"></div>
    </div>
  </div>

  <!-- THE CREW: flyers, applicants, the payroll -->
  <div class="modal" id="modal-hire" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>THE CREW</h2>
        <span class="panel-sub" id="hire-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="hire-list"></div>
      <div id="crew-list"></div>
    </div>
  </div>

  <!-- THE INDEX: a book of chickens, crew, crops, routes, eggs and the diary -->
  <div class="modal" id="modal-pedia" hidden>
    <div class="modal-panel book">
      <div class="book-spine"></div>
      <div class="modal-head">
        <h2>THE INDEX</h2>
        <span class="panel-sub" id="pedia-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="index-tabs">
        <button class="tab-btn" data-act="index-tab" data-tab="chickens">CHICKENS</button>
        <button class="tab-btn" data-act="index-tab" data-tab="staff">CREW</button>
        <button class="tab-btn" data-act="index-tab" data-tab="crops">CROPS</button>
        <button class="tab-btn" data-act="index-tab" data-tab="routes">ROUTES</button>
        <button class="tab-btn" data-act="index-tab" data-tab="eggs">EGGS</button>
        <button class="tab-btn" data-act="index-tab" data-tab="diary">DIARY</button>
        <button class="tab-btn" data-act="index-tab" data-tab="secrets">SECRETS</button>
        <button class="tab-btn" data-act="index-tab" data-tab="ledger" hidden>LEDGER</button>
      </div>
      <div id="pedia"></div>
      <div class="book-corner"></div>
    </div>
  </div>

  <!-- THE GENE LAB: read, splice, clone and cross the flock -->
  <div class="modal genes-room" id="modal-genes" hidden>
    <div class="modal-panel genes">
      <button class="btn btn-tiny genes-close" data-act="close-modal">X</button>
      <div id="genes-body"></div>
    </div>
  </div>

  <!-- THE WORLD: countries to open, branches to build, and the Moon -->
  <div class="modal genes-room" id="modal-world" hidden>
    <div class="modal-panel genes">
      <button class="btn btn-tiny genes-close" data-act="close-modal">X</button>
      <div id="world-body"></div>
    </div>
  </div>

  <!-- THE BILLBOARD: paint the poster that pulls the road in -->
  <div class="modal" id="modal-poster" hidden>
    <div class="modal-panel poster">
      <div class="modal-head">
        <h2>THE BILLBOARD</h2>
        <span class="panel-sub" id="poster-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="poster-wrap">
        <canvas id="poster-canvas" width="700" height="350"></canvas>
      </div>
      <div id="poster-tools"></div>
    </div>
  </div>

  <!-- THE COMPANY: name, mark and colours -->
  <div class="modal" id="modal-company" hidden>
    <div class="modal-panel company">
      <div class="modal-head">
        <h2>THE COMPANY</h2>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="company-body"></div>
    </div>
  </div>

  <!-- THE QUEST BOARD: what the founder wants, several at a time, claimed by hand -->
  <div class="modal" id="modal-quests" hidden>
    <div class="modal-panel board">
      <div class="modal-head">
        <h2>THE QUEST BOARD</h2>
        <span class="panel-sub" id="quests-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="quests-body"></div>
    </div>
  </div>

  <!-- THE WORLD MAP: the valley, its towns and its roads, live -->
  <div class="modal dark" id="modal-wmap" hidden>
    <div class="modal-panel wmap">
      <div class="modal-head">
        <h2>THE VALLEY MAP</h2>
        <span class="panel-sub" id="wmap-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="wmap-wrap">
        <canvas id="wmap-canvas" width="960" height="540"></canvas>
        <div id="wmap-side"></div>
      </div>
    </div>
  </div>

  <!-- THE GARAGE: wheels, paint, upgrades and the way you drive -->
  <div class="modal dark" id="modal-garage" hidden>
    <div class="modal-panel garage">
      <div class="modal-head">
        <h2>THE GARAGE</h2>
        <span class="panel-sub" id="garage-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="garage-body"></div>
    </div>
  </div>

  <!-- THE HR OFFICE: a wall of cameras on every worker -->
  <div class="modal dark" id="modal-hr" hidden>
    <div class="modal-panel hrroom">
      <div class="modal-head">
        <h2>HR - SECURITY ROOM</h2>
        <span class="panel-sub" id="hr-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="hr-wrap">
        <canvas id="hr-canvas" width="900" height="500"></canvas>
        <div id="hr-side"></div>
      </div>
    </div>
  </div>

  <!-- THE PANTRY: produce off the field and goods out of the Cannery -->
  <div class="modal" id="modal-food" hidden>
    <div class="modal-panel pantry">
      <div class="modal-head">
        <h2>THE PANTRY</h2>
        <span class="panel-sub" id="food-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="food-body"></div>
    </div>
  </div>

  <!-- SETTINGS, WARDROBE, ACHIEVEMENTS - shared by the menu and the game -->
  <div class="modal" id="modal-settings" hidden>
    <div class="modal-panel small">
      <div class="modal-head"><h2>SETTINGS</h2><button class="btn btn-tiny" data-act="close-modal">CLOSE</button></div>
      <div id="settings-body"></div>
    </div>
  </div>
  <div class="modal" id="modal-wardrobe" hidden>
    <div class="modal-panel wardrobe">
      <div class="modal-head"><h2>THE WARDROBE</h2><span class="panel-sub" id="wardrobe-sub"></span><button class="btn btn-tiny" data-act="close-modal">CLOSE</button></div>
      <div id="wardrobe-body"></div>
    </div>
  </div>
  <div class="modal" id="modal-ach" hidden>
    <div class="modal-panel ach">
      <div class="modal-head"><h2>ACHIEVEMENTS</h2><span class="panel-sub" id="ach-sub"></span><button class="btn btn-tiny" data-act="close-modal">CLOSE</button></div>
      <div id="ach-body"></div>
    </div>
  </div>

  <div id="fx-layer"></div>
  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/quests.js"></script>
<script src="js/food.js"></script>
<script src="js/garage.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/hr.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
