<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inf Egg Co.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="stage-wrap">
    <canvas id="world" width="1152" height="624"></canvas>

    <div id="res-float">
      <span class="pill">🪙 <b id="r-coins">0</b></span>
      <span class="pill">🪶 <b id="r-feathers">0</b></span>
    </div>

    <div id="toolbelt"></div>
    <div id="build-palette" hidden></div>

    <div id="menu-pop" hidden>
      <button class="btn" data-act="mute">🔊 sound</button>
      <button class="btn" data-act="save">💾 save</button>
      <button class="btn" data-act="reset">🗑️ reset</button>
    </div>

    <div id="bubble" hidden></div>
    <div id="cursor-chip" hidden></div>
  </div>

  <!-- RESEARCH TREE (the Lab) -->
  <div class="modal" id="modal-skills" hidden>
    <div class="modal-panel tree-panel">
      <div class="modal-head">
        <h2>🧪 THE LAB</h2>
        <span class="panel-sub" id="research-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">✖</button>
      </div>
      <div id="tree-wrap">
        <svg id="tree-lines"></svg>
        <div id="tree-nodes"></div>
      </div>
      <div id="skill-card"></div>
    </div>
  </div>

  <!-- CHICKENPEDIA -->
  <div class="modal" id="modal-pedia" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>📖 CHICKENPEDIA</h2>
        <span class="panel-sub" id="pedia-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">✖</button>
      </div>
      <div id="pedia"></div>
    </div>
  </div>

  <div id="fx-layer"></div>
  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
