<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inf Egg Co.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 12' shape-rendering='crispEdges'><path fill='%232e2216' d='M3 0h4v1h-4M2 1h1v1h-1M7 1h1v1h-1M1 2h1v6h-1M8 2h1v6h-1M2 8h1v2h-1M7 8h1v2h-1M3 10h4v1h-4'/><path fill='%23fff8ee' d='M3 1h4v1h-4M2 2h6v6h-6M3 8h4v2h-4'/><path fill='%23f2e2c8' d='M6 3h2v5h-2M5 8h2v2h-2'/><path fill='%23ffd23f' d='M4 4h2v1h-2M3 6h1v1h-1M6 6h1v1h-1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="stage-wrap">
    <canvas id="world" width="1152" height="624"></canvas>

    <div id="res-float">
      <span class="pill" id="pill-coins"><b id="r-coins">0</b></span>
      <span class="pill" id="pill-feathers"><b id="r-feathers">0</b></span>
    </div>

    <div id="toolbelt"></div>
    <div id="build-palette" hidden></div>

    <div id="menu-pop" hidden>
      <button class="btn" id="btn-mute" data-act="mute">SOUND ON</button>
      <button class="btn" data-act="save">SAVE</button>
      <button class="btn" data-act="reset">RESET</button>
    </div>

    <div id="bubble" hidden></div>
    <div id="cursor-chip" hidden></div>
  </div>

  <!-- RESEARCH: the hex grid inside the Lab -->
  <div class="modal" id="modal-skills" hidden>
    <div class="modal-panel tree-panel">
      <div class="modal-head">
        <h2>THE LAB</h2>
        <span class="panel-sub" id="research-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="tree-wrap">
        <canvas id="tree-canvas" width="620" height="360"></canvas>
      </div>
      <div id="skill-card"></div>
    </div>
  </div>

  <!-- CHICKENPEDIA -->
  <div class="modal" id="modal-pedia" hidden>
    <div class="modal-panel">
      <div class="modal-head">
        <h2>CHICKENPEDIA</h2>
        <span class="panel-sub" id="pedia-sub"></span>
        <button class="btn btn-tiny" data-act="close-modal">CLOSE</button>
      </div>
      <div id="pedia"></div>
    </div>
  </div>

  <div id="fx-layer"></div>
  <div id="toasts"></div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
